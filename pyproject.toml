[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forensics-app"
version = "0.1.0"
description = "Extensible Tkinter starter for an MSc Computer Vision course"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0,<13",
    "numpy>=1.24,<3.0",
    "scikit-image>=0.22",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "opencv-python>=4.8",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["ruff>=0.6.9"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.setuptools.packages.find]
include = ["forensics_app*"]
